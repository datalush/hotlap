[package]
name = "hotlap-runtime"
version = "0.0.0"
edition = "2024"

[dependencies]
hotlap = { path = "../hotlap" }
hotlap-connectors = { path = "../hotlap-connectors" }
hotlap-engine = { path = "../hotlap-engine" }
hotlap-sql = { path = "../hotlap-sql" }
arrow = "59.2"
async-trait = "0.1"
datafusion = { version = "55.1", default-features = false, features = ["sql"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "time"] }

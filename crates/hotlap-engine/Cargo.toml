[package]
name = "hotlap-engine"
version = "0.0.0"
edition = "2024"

[features]
# Activates stats_alloc only in the cfg(test) paired benchmark module.
bench-allocation-observer = []

[dependencies]
arrow = "59.2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
hotlap-core = { path = "../hotlap-core" }

[dev-dependencies]
# Enables the deterministic multiset copy counter used by the cost tests.
hotlap-core = { path = "../hotlap-core", features = ["test-instrumentation"] }
serde_json = "1"
stats_alloc = "0.1.10"

[package]
name = "fluss-datafusion"
version = "0.1.0"
description = "Native Fluss sources and sinks for the Hotlap DataFusion engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arrow = "59.2"
async-trait = "0.1"
datafusion = { version = "55.1", default-features = false, features = ["sql"] }
fluss-rs = { path = "../../clients/rust/crates/fluss", features = ["storage-s3"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
fluss-rs = { path = "../../clients/rust/crates/fluss", features = ["integration_tests"] }
fluss-test-cluster = { path = "../../clients/rust/crates/fluss-test-cluster" }
tempfile = "3"
metrics = "0.24"
metrics-util = "0.20"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "process"] }

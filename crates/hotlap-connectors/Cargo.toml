[package]
name = "hotlap-connectors"
version = "0.0.0"
edition = "2024"

[dependencies]
hotlap = { path = "../hotlap" }
arrow = "59.2"
datafusion = { version = "55.1", default-features = false, features = ["sql"] }
fluss-rs = { path = "../../clients/rust/crates/fluss", features = ["storage-s3"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
